version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 10
    rebase-strategy: auto
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: deps
    groups:
      python-production:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      python-development:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: ci-deps
    groups:
      ci-tooling:
        patterns:
          - "*"

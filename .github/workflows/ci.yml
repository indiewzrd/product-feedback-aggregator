name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install --editable ".[dev]"
      - name: Check the installed dependency graph
        run: python -m pip check
      - name: Run the offline test suite
        run: python -m pytest
      - name: Byte-compile source and tests
        run: python -m compileall -q -f src tests

  quality:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/requirements/ci.txt
      - name: Install pinned analysis tools
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install --requirement .github/requirements/ci.txt
      - name: Lint all source and tests with Ruff
        run: python -m ruff check --output-format=github src tests
      - name: Type-check all source with mypy
        run: python -m mypy src
      - name: Check schema JSON syntax and agent-skill parity
        run: |
          python -m json.tool schemas/feedback.schema.json > /dev/null
          python -m json.tool schemas/input.schema.json > /dev/null
          cmp .agents/skills/product-feedback/SKILL.md .claude/skills/product-feedback/SKILL.md
      - name: Audit application and CI dependencies
        run: |
          python -m pip_audit --strict --progress-spinner=off .
          python -m pip_audit \
            --strict \
            --progress-spinner=off \
            --requirement=.github/requirements/ci.txt

  package:
    name: Package and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/requirements/ci.txt
      - name: Install pinned build tools
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install --requirement .github/requirements/ci.txt
      - name: Build wheel and source archive
        run: python -m build --sdist --wheel --outdir dist
      - name: Validate package metadata and contents
        run: |
          python -m twine check --strict dist/*
          python -m check_wheel_contents dist/*.whl
      - name: Smoke-test the built wheel
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install --upgrade "pip==26.2.1"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m feedback_aggregator --help
      - name: Smoke-test the source archive and installed zero-key workflow
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/sdist-smoke"
          "${RUNNER_TEMP}/sdist-smoke/bin/python" -m pip install --upgrade "pip==26.2.1"
          "${RUNNER_TEMP}/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          "${RUNNER_TEMP}/sdist-smoke/bin/feedback" init --directory "${RUNNER_TEMP}/feedback-smoke"
          "${RUNNER_TEMP}/sdist-smoke/bin/feedback" \
            --config "${RUNNER_TEMP}/feedback-smoke/feedback.yml" check
          "${RUNNER_TEMP}/sdist-smoke/bin/feedback" \
            --config "${RUNNER_TEMP}/feedback-smoke/feedback.yml" run
      - name: Audit runtime dependencies and create a runtime CycloneDX SBOM
        run: |
          python -m pip_audit \
            --strict \
            --progress-spinner=off \
            --format=cyclonedx-json \
            --output=dist/product-feedback-aggregator.cdx.json \
            .
      - name: Create the checksum manifest
        run: (cd dist && sha256sum ./*.whl ./*.tar.gz ./*.json > SHA256SUMS)
      - name: Upload the validated package bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Tag provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - quality
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the validated package bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package
          path: release
      - name: Attest the release bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release/*
